<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슈렙수학 사칙연산 — 원리가 살아있는 연산 학습지 생성기</title>
<style>
  :root {
    --mint:#bfe6df; --mint-dark:#6fbfb0; --mint-deep:#3f9c8c; --ink:#222;
    --hl-y:#fff59d; --hl-b:#cfe8ff; --red:#d33;
    --pl0:#fff5c2; --pl1:#d9ecff; --pl2:#d9f3e3; --pl3:#fbe3f1;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#eef3f2; color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; word-break:keep-all; }

  .toolbar { position:sticky; top:0; z-index:10; background:#fff;
    border-bottom:2px solid var(--mint); padding:9px 14px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .toolbar .brandname { font-weight:800; color:var(--mint-deep); margin-right:6px; }
  .toolbar select,.toolbar button { font-size:13px; padding:7px 11px; border-radius:10px;
    border:1.5px solid var(--mint-dark); background:#fff; cursor:pointer; max-width:430px; }
  .toolbar button.primary { background:var(--mint-dark); color:#fff; font-weight:700; }
  .toolbar button.toggled { background:var(--red); color:#fff; border-color:var(--red); }
  .toolbar label.chk { font-size:13px; display:flex; align-items:center; gap:4px; }
  .toolbar .code-chip { margin-left:auto; font-family:ui-monospace,monospace; font-size:13px;
    background:var(--mint); border-radius:10px; padding:6px 10px; cursor:pointer; }
  .toolbar .code-chip:hover { background:var(--mint-dark); color:#fff; }

  .sheet { width:210mm; height:296mm; margin:14px auto; padding:10mm 11mm 9mm;
    background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.12); position:relative;
    display:flex; flex-direction:column; }
  .sheet .filler { flex:1; }
  .sheet-head { display:flex; align-items:flex-start; gap:5mm; margin-bottom:3mm; }
  .title-bubble { flex:1; border:2.5px solid var(--mint-dark); border-radius:999px;
    padding:2.5mm 5mm 2.5mm 12mm; font-size:14pt; font-weight:800; position:relative; line-height:1.3; }
  .title-bubble::before { content:""; position:absolute; left:3mm; top:50%; transform:translateY(-50%);
    width:6mm; height:6mm; border-radius:50%; background:var(--mint); }
  .red { color:var(--red); }
  .head-side { text-align:right; font-size:8.5pt; color:var(--mint-deep); white-space:nowrap; }
  .head-side .thumb { display:inline-block; background:var(--mint); border-radius:999px;
    padding:1.2mm 4mm; font-weight:800; font-size:11pt; color:var(--ink); }
  .head-side .brand { margin-top:1mm; }
  .head-side .date { margin-top:1.5mm; color:var(--ink); font-size:10pt; }
  .datebox { display:inline-block; width:9mm; height:7mm; border:1.5px solid var(--mint-dark);
    border-radius:1.5mm; vertical-align:middle; background:#fdfefe; }
  .date .gap { display:inline-block; width:3mm; }
  .sheet-head.small { border-bottom:1.5px solid var(--mint); padding-bottom:1.5mm; }
  .mini-title { font-size:10pt; font-weight:700; color:#666; }

  .read-aloud { font-size:9.5pt; margin:1.5mm 0 0.5mm; }
  .read-aloud .label { color:var(--red); font-weight:700; }
  .principle { font-size:10pt; margin-bottom:1mm; line-height:1.5; }
  .principle mark { background:var(--hl-y); font-weight:800; padding:0 1mm; }
  .encourage { font-size:9pt; color:#555; margin-bottom:2mm; }

  .example { border-top:2px solid #bbb; border-bottom:1.5px solid #ddd;
    padding:2mm 1mm; font-size:11.5pt; font-weight:700; line-height:1.9; }
  .example .tag { font-size:8.5pt; color:#fff; background:var(--mint-dark);
    border-radius:2mm; padding:0.5mm 2mm; vertical-align:middle; margin-right:2mm; }
  .hl-y { background:var(--hl-y); padding:0 1mm; }
  .hl-b { background:var(--hl-b); padding:0 1mm; }
  .circ { border:2px solid var(--red); border-radius:999px; padding:0 1.5mm; }
  .example-grids { display:flex; gap:8mm; align-items:flex-start; padding:1mm 0; zoom:0.72; }

  .rows { margin-top:0.5mm; flex:1; display:grid; grid-auto-rows:minmax(min-content, 15.2mm); align-content:start; }
  .prob-row { border-bottom:1.2px solid #ccc; padding:1mm 1mm; font-size:13.5pt;
    line-height:1.5; min-height:8.6mm; align-content:center; }
  .prob-row.l2 { padding-left:13mm; }
  .prob-row.sub { border-bottom:1.2px solid #ccc; }
  .prob-row .lbl { display:inline-block; min-width:14mm; font-size:10pt; color:#444; }
  .rows.two-col { grid-template-columns:1fr 1fr; grid-auto-flow:column;
    grid-template-rows:repeat(20, minmax(min-content, 11.8mm)); column-gap:8mm; }
  .rows.two-col .prob-row { break-inside:avoid; }
  .rows.compact .prob-row { padding:1.4mm 1mm; min-height:7.4mm; font-size:12.5pt; }
  .rows.fill1 { grid-template-rows:1fr; grid-auto-rows:auto; }
  .sheet.f-xl .prob-row { font-size:15pt; }
  .sheet.f-xl .bx { min-width:10.5mm; min-height:9mm; }
  .sheet.f-lg .prob-row { font-size:14pt; }
  .av { color:var(--red); font-weight:800; }
  .bx { display:inline-block; min-width:9.5mm; min-height:8mm; border:1.6px solid #333;
    border-radius:1mm; text-align:center; vertical-align:middle; padding:0 1mm; }
  .opcirc { border:1.8px solid var(--red); border-radius:999px; padding:0 1mm; white-space:nowrap; }
  .opcirc + .opcirc { margin-left:1.6mm; }
  .blank-w { display:inline-block; min-width:9mm; }
  .sent { font-size:10.5pt; }
  .sent .bx { min-width:8mm; min-height:7mm; }
  u.pair { text-decoration-thickness:2px; }

  .grid-area { flex:1; display:grid; grid-template-columns:repeat(var(--cols,3), 1fr);
    align-content:space-evenly; justify-items:center; gap:3mm 3mm; margin-top:3mm; }
  .grid-area > div, .grid-area > table { break-inside:avoid; }
  .vgrid { border-collapse:collapse; }
  .vgrid td { width:9mm; height:9mm; border:0.35mm solid #999; text-align:center;
    font-size:12.5pt; font-weight:700; padding:0; }
  .vgrid td.nb { border:none; }
  .vgrid td.op { border:none; font-weight:800; white-space:nowrap; text-align:right;
    padding-right:1mm; min-width:8mm; width:auto; font-size:11.5pt; }
  .vgrid td.note { border:none; font-size:7.5pt; color:#777; text-align:left;
    padding-left:1.5mm; white-space:nowrap; width:auto; font-weight:400; }
  .vgrid td.carry { border:0.45mm solid var(--red); background:#fff5f5; font-size:9pt; color:var(--red); }
  .vgrid td.memo { border:0.3mm solid #e99; background:#fffafa; height:5.5mm; font-size:8pt; color:var(--red); }
  .vgrid td.pl0 { background:var(--pl0); } .vgrid td.pl1 { background:var(--pl1); }
  .vgrid td.pl2 { background:var(--pl2); } .vgrid td.pl3 { background:var(--pl3); }
  .vgrid tr.rule td { border-top:0.55mm solid #333; }
  .vgrid tr.rule td.nb, .vgrid tr.rule td.op, .vgrid tr.rule td.note { border-top:none; }
  .vgrid tr.rule td.ruled { border-top:0.55mm solid #333; }
  .vgrid .strike { text-decoration:line-through; text-decoration-color:var(--red); text-decoration-thickness:2px; }
  .vgrid.mini td { width:7mm; height:7mm; font-size:10pt; }
  .vgrid.dense td { width:7.6mm; height:7.6mm; font-size:11pt; }
  .vgrid.dense2 td { width:7mm; height:7mm; font-size:10.5pt; }
  .memo-label { font-size:7pt; color:var(--red); }
  .vgrid td.op { position:relative; }
  .vgrid td.op:has(svg.brk) { padding-right:3mm; }
  svg.brk { position:absolute; right:-1.4mm; top:0; height:100%; width:3.4mm; overflow:visible; }

  .divwrap { display:flex; gap:2.5mm; align-items:flex-start; }
  .divside { font-size:8.5pt; display:flex; flex-direction:column; gap:1mm; width:47mm; }
  .divside .sbox { border:1.2px solid #999; border-radius:1.5mm; padding:0.8mm 2mm; margin-bottom:0; }
  .sbox-cap { font-size:6.5pt; color:#999; font-weight:400; line-height:1.2; }
  .divside .sbox .st { font-weight:700; color:#444; }
  .divside .quot { white-space:nowrap; }
  .cbox.qb { min-width:5.6mm; min-height:4.8mm; margin:0 0.3mm; }
  .cbox { display:inline-block; min-width:7mm; min-height:6.5mm; border:1.2px solid #333;
    border-radius:1mm; text-align:center; vertical-align:middle; font-weight:700; padding:0 0.5mm; }

  .tt-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:3.5mm; }
  .tt-title { font-size:15pt; font-weight:800; color:var(--mint-deep); }
  .tt-note { font-size:9pt; color:#666; }
  .ttable { border-collapse:collapse; }
  .ttable td { width:var(--ttc); height:var(--ttc); text-align:center; font-size:var(--ttf);
    font-weight:700; border:0.4mm solid #9ccec4; }
  .ttable td.tt-h { background:var(--mint); color:#1c5b51; font-weight:800; }
  .ttable td.tt-corner { background:var(--mint-dark); color:#fff; }
  .ttable tr.tt-alt td:not(.tt-h):not(.tt-sq) { background:#f2faf8; }
  .ttable td.tt-sq { background:var(--hl-y); }
  .quest { font-size:9pt; color:#444; margin-top:2mm; border:1.5px solid var(--mint);
    border-radius:3mm; padding:1.5mm 4mm; }
  .sheet-foot { margin-top:3mm; display:flex; justify-content:center; }
  .mood { border:2px solid var(--mint-dark); border-radius:999px; padding:1.8mm 6mm;
    font-size:9.5pt; display:flex; gap:3mm; align-items:center; }

  @page { size:A4 portrait; margin:0; }
  @media print {
    body { background:#fff; }
    .toolbar { display:none; }
    .sheet { margin:0; box-shadow:none; width:210mm; min-height:auto; height:296mm;
      page-break-after:always; overflow:hidden; }
    .sheet:last-child { page-break-after:auto; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="brandname">슈렙수학 사칙연산</span>
  <select id="skillSelect"></select>
  <button id="btnPrev">◀</button><button id="btnNext">▶</button>
  <button class="primary" id="btnRegen">다른 문제지</button>
  <button id="btnAnswer">정답지 보기</button>
  <label class="chk" id="blankWrap" style="display:none"><input type="checkbox" id="chkBlank"> 빈 연습지</label>
  <button id="btnPrint">인쇄 (앞·뒤 2쪽)</button>
  <span class="code-chip" id="codeChip" title="클릭하면 번호를 입력해 같은 문제지·정답지를 다시 볼 수 있어요">문제지 번호: <b id="sheetCode"></b> 🔍</span>
</div>

<div id="pages"></div>

<script>
"use strict";
/*__CORE_START__*/

/* 시드 기반 결정론적 난수 (mulberry32) */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rngInt(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
function rngPick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
const ones = n => n % 10;
const tens = n => Math.floor(n / 10) % 10;
const ndig = n => String(Math.abs(n)).length;
const rep = (v, k, sep) => Array(k).fill(v).join(sep || " + ");

/* 제약 만족까지 재시도 */
function tryGen(rng, make, ok, maxTry) {
  for (let i = 0; i < (maxTry || 400); i++) { const p = make(); if (ok(p)) return p; }
  return make();
}

/* 정답 표기 헬퍼 */
const AV = v => `<span class="av">${v}</span>`;
const SEG = (show, h) => (show ? AV(h) : "");
const BX = (show, v) => `<span class="bx">${show ? AV(v) : "&nbsp;"}</span>`;

/* 문제지 번호 인코딩 */
function encodeCode(si, seed) {
  return (si * 1000000 + (seed % 1000000)).toString(36).toUpperCase().padStart(5, "0");
}

/* W칸 오른쪽 정렬 숫자 셀 (mode: given/ans/hidden/none) */
function numCells(n, W, mode, opts) {
  opts = opts || {};
  const s = (n === null || n === undefined) ? "" : String(n);
  let h = "";
  for (let j = 0; j < W; j++) {
    const k = j - (W - s.length);
    const place = W - 1 - j;
    let cls = opts.cls || "";
    if (opts.colorByPlace) cls += " pl" + Math.min(place, 3);
    if (mode === "none") { h += `<td class="nb"></td>`; continue; }
    if (mode === "hidden") {
      h += (opts.limitPlaces !== undefined && place >= opts.limitPlaces) ? `<td class="nb"></td>` : `<td class="${cls}">&nbsp;</td>`;
      continue;
    }
    if (k < 0) { h += opts.padBox ? `<td class="${cls}">&nbsp;</td>` : `<td class="nb"></td>`; continue; }
    let d = s[k];
    if (opts.strikeAt !== undefined && place === opts.strikeAt) d = `<span class="strike">${d}</span>`;
    h += `<td class="${cls}">${mode === "ans" ? `<span class="av">${d}</span>` : d}</td>`;
  }
  return h;
}
function row(op, cellsHtml, note, cls) {
  return `<tr class="${cls || ""}"><td class="op">${op || ""}</td>${cellsHtml}<td class="note">${note || ""}</td></tr>`;
}
function vt(inner, cls) { return `<table class="vgrid ${cls || ""}">${inner}</table>`; }

/* 덧셈 세로셈 확장형 */
function vaddExpanded(p, show, blank, notes) {
  const W = 3;
  const g = blank ? "hidden" : "given";
  const m = (show && !blank) ? "ans" : "hidden";
  const nt = t => (show && !blank && notes) ? t : "";
  let h = "";
  if (blank) {
    h = row("", numCells(null, W, "hidden")) + row("+", numCells(null, W, "hidden"));
    h += row("", numCells(null, W, "hidden"), "", "rule") + row("+", numCells(null, W, "hidden"));
    h += row("", numCells(null, W, "hidden"), "", "rule");
    return vt(h);
  }
  const oa = ones(p.a), ob = ones(p.b), ta = tens(p.a), tb = tens(p.b);
  const oSum = oa + ob, tSum = ta * 10 + tb * 10, total = p.a + p.b;
  h = row("", numCells(p.a, W, g)) + row("+", numCells(p.b, W, g));
  h += row("", numCells(show ? oSum : null, W, m), nt(`${oa}+${ob}`), "rule");
  h += row(show ? "+" : "", numCells(show ? tSum : null, W, m), nt(`${ta * 10}+${tb * 10}`));
  h += row("", numCells(show ? total : null, W, m), nt(`${oSum}+${tSum}`), "rule");
  return vt(h);
}

/* 뺄셈 세로셈 확장형 (borrow 옵션) */
function vsubExpanded(p, show, blank, borrow, notes) {
  const W = 3;
  const m = (show && !blank) ? "ans" : "hidden";
  const nt = t => (show && !blank && notes) ? t : "";
  let h = "";
  if (blank) {
    if (borrow) h += `<tr><td class="op"></td><td class="nb"></td><td class="carry">&nbsp;</td><td class="carry">&nbsp;</td><td class="note"></td></tr>`;
    h += row("", numCells(null, W, "hidden")) + row("−", numCells(null, W, "hidden"));
    h += row("", numCells(null, W, "hidden"), "", "rule") + row("+", numCells(null, W, "hidden"));
    h += row("", numCells(null, W, "hidden"), "", "rule");
    return vt(h);
  }
  const oa = ones(p.a), ob = ones(p.b), ta = tens(p.a), tb = tens(p.b);
  if (!borrow) {
    const oD = oa - ob, tD = ta * 10 - tb * 10, total = p.a - p.b;
    h = row("", numCells(p.a, W, "given")) + row("−", numCells(p.b, W, "given"));
    h += row("", numCells(show ? oD : null, W, m), nt(`${oa}−${ob}`), "rule");
    h += row("+", numCells(show ? tD : null, W, m), nt(`${ta * 10}−${tb * 10}`));
    h += row("", numCells(show ? total : null, W, m), nt(`${oD}+${tD}`), "rule");
    return vt(h);
  }
  const oD = 10 + oa - ob, tD = (ta - 1) * 10 - tb * 10, total = p.a - p.b;
  h = `<tr><td class="op"></td><td class="nb"></td><td class="carry">${show ? AV(ta - 1) : "&nbsp;"}</td><td class="carry">${show ? AV(10) : "&nbsp;"}</td><td class="note"></td></tr>`;
  h += row("", numCells(p.a, W, "given", show ? { strikeAt: 1 } : {}));
  h += row("−", numCells(p.b, W, "given"));
  h += row("", numCells(show ? oD : null, W, m), nt(`${10 + oa}−${ob}`), "rule");
  h += row("+", numCells(show ? tD : null, W, m), nt(`${(ta - 1) * 10}−${tb * 10}`));
  h += row("", numCells(show ? total : null, W, m), nt(`${oD}+${tD}`), "rule");
  return vt(h);
}

/* 간단한 덧셈 세로셈 (표준형, 받아올림 칸) */
function vaddSimple(p, show, blank) {
  const W = 3;
  const m = (show && !blank) ? "ans" : "hidden";
  let carryRow = "";
  if (blank) {
    carryRow = `<tr><td class="op"></td><td class="carry">&nbsp;</td><td class="carry">&nbsp;</td><td class="nb"></td><td class="note"></td></tr>`;
    return vt(carryRow + row("", numCells(null, W, "hidden")) + row("+", numCells(null, W, "hidden")) + row("", numCells(null, W, "hidden"), "", "rule"));
  }
  const c1 = (ones(p.a) + ones(p.b)) >= 10 ? 1 : 0;
  const c2 = (tens(p.a) + tens(p.b) + c1) >= 10 ? 1 : 0;
  carryRow = `<tr><td class="op"></td><td class="carry">${show && c2 ? AV(1) : "&nbsp;"}</td><td class="carry">${show && c1 ? AV(1) : "&nbsp;"}</td><td class="nb"></td><td class="note"></td></tr>`;
  let h = carryRow + row("", numCells(p.a, W, "given")) + row("+", numCells(p.b, W, "given"));
  h += row("", numCells(show ? p.a + p.b : null, W, m), "", "rule");
  return vt(h);
}

/* 간단한 뺄셈 세로셈 (표준형, 받아내림 칸) */
function vsubSimple(p, show, blank) {
  const W = 2;
  const m = (show && !blank) ? "ans" : "hidden";
  let borrowRow;
  if (blank) {
    borrowRow = `<tr><td class="op"></td><td class="carry">&nbsp;</td><td class="carry">&nbsp;</td><td class="note"></td></tr>`;
    return vt(borrowRow + row("", numCells(null, W, "hidden")) + row("−", numCells(null, W, "hidden")) + row("", numCells(null, W, "hidden"), "", "rule"));
  }
  borrowRow = `<tr><td class="op"></td><td class="carry">${show ? AV(tens(p.a) - 1) : "&nbsp;"}</td><td class="carry">${show ? AV(10) : "&nbsp;"}</td><td class="note"></td></tr>`;
  let h = borrowRow + row("", numCells(p.a, W, "given", show ? { strikeAt: 1 } : {}));
  h += row("−", numCells(p.b, W, "given"));
  h += row("", numCells(show ? p.a - p.b : null, W, m), "", "rule");
  return vt(h);
}

/* 곱셈 세로셈 확장형 (부분곱 행 명시) */
function vmulExpanded(p, show, blank, fixedW, notes, dense) {
  const m = (show && !blank) ? "ans" : "hidden";
  const nt = t => (show && !blank && notes) ? t : "";
  if (blank) {
    const W = fixedW || 3, rows = fixedW === 4 ? 3 : 2;
    let h = row("", numCells(null, W, "hidden")) + row("×", numCells(null, W, "hidden"));
    for (let i = 0; i < rows; i++) h += row("", numCells(null, W, "hidden"), "", i === 0 ? "rule" : "");
    h += row("", numCells(null, W, "hidden"), "", "rule");
    return vt(h, dense ? "dense" : "");
  }
  const W = fixedW || ndig(p.a * p.b);
  const digs = String(p.a).split("").map(Number).reverse();
  let h = row("", numCells(p.a, W, "given")) + row("×", numCells(p.b, W, "given"));
  digs.forEach((d, i) => {
    const part = d * Math.pow(10, i) * p.b;
    h += row("", numCells(show ? part : null, W, m), nt(`${d * Math.pow(10, i)}×${p.b}`), i === 0 ? "rule" : "");
  });
  h += row("", numCells(show ? p.a * p.b : null, W, m), "", "rule");
  return vt(h, dense ? "dense" : "");
}

/* 곱셈 세로셈 표준형 (받아올림 메모 칸) */
function vmulStandard(p, show, blank, fixedW) {
  const m = (show && !blank) ? "ans" : "hidden";
  const W = blank ? (fixedW || 4) : (fixedW || ndig(p.a * p.b));
  let memo = `<tr><td class="op"><span class="memo-label">받아올림→</span></td>`;
  if (blank) {
    for (let j = 0; j < W; j++) memo += `<td class="memo">&nbsp;</td>`;
    memo += `<td class="note"></td></tr>`;
    return vt(memo + row("", numCells(null, W, "hidden")) + row("×", numCells(null, W, "hidden")) + row("", numCells(null, W, "hidden"), "", "rule"));
  }
  const carries = [];
  { let c = 0; const s = String(p.a).split("").map(Number).reverse();
    for (let i = 0; i < s.length; i++) { const x = s[i] * p.b + c; c = Math.floor(x / 10); carries[i + 1] = c; } }
  for (let j = 0; j < W; j++) {
    const place = W - 1 - j;
    const v = carries[place];
    memo += `<td class="memo">${show && v ? AV(v) : "&nbsp;"}</td>`;
  }
  memo += `<td class="note"></td></tr>`;
  let h = memo + row("", numCells(p.a, W, "given")) + row("×", numCells(p.b, W, "given"));
  h += row("", numCells(show ? p.a * p.b : null, W, m), "", "rule");
  return vt(h);
}

/* 곱셈 세로셈 두 자리 수 곱 (부분곱 2행) */
function vmul2d(p, show, blank, opts) {
  opts = opts || {};
  const m = (show && !blank) ? "ans" : "hidden";
  const nt = t => (show && !blank && opts.notes) ? t : "";
  const W = opts.fixedW || ndig(p.a * p.b);
  let memo = "";
  if (opts.memo) {
    memo = `<tr><td class="op"><span class="memo-label">받아올림→</span></td>`;
    for (let j = 0; j < W; j++) memo += `<td class="memo">&nbsp;</td>`;
    memo += `<td class="note"></td></tr>`;
  }
  if (blank) {
    let h = memo + row("", numCells(null, W, "hidden")) + row("×", numCells(null, W, "hidden"));
    h += row("", numCells(null, W, "hidden"), "", "rule") + row("", numCells(null, W, "hidden"));
    h += row("", numCells(null, W, "hidden"), "", "rule");
    return vt(h, opts.dense2 ? "dense2" : (opts.dense ? "dense" : ""));
  }
  const p1 = p.a * ones(p.b), p2 = p.a * tens(p.b) * 10;
  let h = memo + row("", numCells(p.a, W, "given")) + row("×", numCells(p.b, W, "given"));
  h += row("", numCells(show ? p1 : null, W, m), nt(`${p.a}×${ones(p.b)}`), "rule");
  h += row("", numCells(show ? p2 : null, W, m), nt(`${p.a}×${tens(p.b) * 10}`));
  h += row("", numCells(show ? p.a * p.b : null, W, m), "", "rule");
  return vt(h, opts.dense2 ? "dense2" : (opts.dense ? "dense" : ""));
}

/* 몫을 자리값 부분몫으로 분해 */
function divParts(q) {
  const s = String(q), out = [];
  for (let i = 0; i < s.length; i++) { const d = +s[i]; if (d > 0) out.push(d * Math.pow(10, s.length - 1 - i)); }
  return out;
}

/* 몫을 자리값 부분몫으로 분해 — 0인 자리도 단계로 포함 (문제지 ①~④ 단계 힌트·"몫: 80 + 0" 표기와 일치) */
function divPartsZero(q) {
  const s = String(q), out = [];
  for (let i = 0; i < s.length; i++) out.push(+s[i] * Math.pow(10, s.length - 1 - i));
  return out;
}

/* 나눗셈 세로셈 — 몫 한 줄(자리색) + 나눗셈 기호(곡선 괄호·가로선) + 부분몫 빼기 단계 */
function longDiv(p, show, blank, opts) {
  opts = opts || {};
  const dcls = opts.dense2 ? "dense2" : (opts.dense ? "dense" : "");
  const QR = opts.fixedQ || 1;
  const STEP = "①②③④⑤⑥";
  if (blank || !show) {
    const W = blank ? (opts.fixedW || 2) : ndig(p.n);
    let h = row("", numCells(null, W, "hidden", { colorByPlace: true, limitPlaces: QR }), "…");
    h += row(blank ? `<svg class="brk" viewBox="0 0 10 40" preserveAspectRatio="none"><path d="M6 0 Q 13 20 6 40" fill="none" stroke="#222" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>` : `${p.d} <svg class="brk" viewBox="0 0 10 40" preserveAspectRatio="none"><path d="M6 0 Q 13 20 6 40" fill="none" stroke="#222" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`,
      blank ? numCells(null, W, "hidden") : numCells(p.n, W, "given"), "", "rule");
    const hint = !blank && opts.stepHints;
    for (let i = 0; i < QR; i++) {
      h += row("−", numCells(null, W, "hidden"), hint ? `${STEP[2 * i]}${p.d}×` : "");
      h += row("", numCells(null, W, "hidden"), hint ? `${STEP[2 * i + 1]}−${i === QR - 1 ? " 나머지" : ""}` : "", "rule");
    }
    return vt(h, dcls);
  }
  const W = ndig(p.n);
  const parts = divPartsZero(p.q);
  const nt = t => opts.notes ? t : "";
  let h = row("", numCells(p.q, W, "ans", { colorByPlace: true }), p.r > 0 ? AV(`…${p.r}`) : "");
  h += row(`${p.d} <svg class="brk" viewBox="0 0 10 40" preserveAspectRatio="none"><path d="M6 0 Q 13 20 6 40" fill="none" stroke="#222" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`, numCells(p.n, W, "given"), "", "rule");
  let rem = p.n;
  parts.forEach((part, i) => {
    const sub = part * p.d;
    h += row("−", numCells(sub, W, "ans"), nt(`${p.d}×${part}`));
    const nr = rem - sub;
    const last = i === parts.length - 1;
    h += row("", numCells(nr, W, "ans"), last ? "← <span class='memo-label'>나머지</span>" : nt(`${rem}−${sub}`), "rule");
    rem = nr;
  });
  for (let i = parts.length; i < QR; i++) {
    h += row("", numCells(null, W, "none")) + row("", numCells(null, W, "none"));
  }
  return vt(h, dcls);
}

/* 나눗셈식·검산식 박스 (내부 콘텐츠만 반환 — divProblem이 divside로 감쌈) */
function divSideBoxInner(p, show, blank, opts) {
  opts = opts || {};
  const B = v => `<span class="cbox">${(show && !blank) ? AV(v) : "&nbsp;"}</span>`;
  const cap = `<div class="sbox-cap">몫과 나머지가 맞는지 확인하는 계산</div>`;
  if (blank) return `<div class="sbox"><div class="st">&lt;나눗셈식&gt;</div><div>&nbsp;÷&nbsp;=&nbsp;…</div></div><div class="sbox"><div class="st">&lt;검산식&gt;</div>${cap}<div>(&nbsp;×&nbsp;)+&nbsp;=</div></div>`;
  const parts = divParts(p.q);
  let quot = "";
  if (show && (parts.length > 1 || opts.showQuot)) {
    const qs = String(p.q), pl = opts.showQuot ? qs.split("").map((d, i) => +d * Math.pow(10, qs.length - 1 - i)) : parts;
    quot = `<div>몫: ${pl.map(AV).join(" + ")}${pl.length > 1 ? ` = ${AV(p.q)}` : ""}</div>`;
  } else if (!show && opts.showQuot) {
    const bx = '<span class="cbox qb">&nbsp;</span>';
    quot = `<div class="quot">몫: ${Array(opts.fixedQ || 2).fill(bx).join("+")}=${bx}</div>`;
  }
  return `<div class="sbox"><div class="st">&lt;나눗셈식&gt;</div><div>${p.n} ÷ ${p.d} = ${B(p.q)} ${p.r > 0 || !show ? "…" : ""} ${p.r > 0 || !show ? B(p.r) : ""}</div>${quot}</div>
    <div class="sbox"><div class="st">&lt;검산식&gt;</div>${cap}<div>( ${B(p.d)} × ${B(p.q)} ) + ${B(p.r)}</div><div>= ${B(p.d * p.q)} + ${B(p.r)} = ${B(p.n)}</div></div>`;
}

/* 검산용 곱셈 미니 세로셈 */
function vmulMini(x, y, show, blank, opts) {
  opts = opts || {};
  if (blank) {
    const W = opts.fixedW || 3;
    const parts = opts.parts || 1;
    let h = row("", numCells(null, W, "hidden")) + row("×", numCells(null, W, "hidden"));
    for (let i = 0; i < parts; i++) h += row("", numCells(null, W, "hidden"), "", i === 0 ? "rule" : "");
    if (parts > 1) h += row("", numCells(null, W, "hidden"), "", "rule");
    return vt(h, "mini");
  }
  const prod = x * y, W = opts.fixedW || ndig(prod);
  const m = show ? "ans" : "hidden";
  let h = row("", numCells(show ? x : null, W, m)) + row("×", numCells(show ? y : null, W, m));
  const digs = String(y).split("").map(Number).reverse();
  const nz = digs.filter(d => d > 0).length;
  if (x >= 10 && y >= 10 && nz >= 2) {
    let first = true;
    digs.forEach((dg, i) => {
      if (dg > 0) {
        h += row("", numCells(show ? x * dg * Math.pow(10, i) : null, W, m), "", first ? "rule" : "");
        first = false;
      }
    });
    h += row("", numCells(show ? prod : null, W, m), "", "rule");
  } else {
    h += row("", numCells(show ? prod : null, W, m), "", "rule");
  }
  return vt(h, "mini");
}

/* 나눗셈 문제 1개 전체 배치 (격자 + 사이드 박스) */
function divProblem(p, show, blank, opts) {
  opts = opts || {};
  let side = "";
  if (opts.side) {
    const miniOpts = { fixedW: opts.miniW, parts: opts.miniParts };
    let mini = "";
    if (opts.miniCheck && !blank) mini = vmulMini(p.d, p.q, show, blank, miniOpts);
    else if (opts.miniCheck) mini = vmulMini(null, null, false, true, miniOpts);
    side = `<div class="divside">${divSideBoxInner(p, show, blank, opts)}${mini}</div>`;
  }
  return `<div class="divwrap">${longDiv(p, show, blank, opts)}${side}</div>`;
}

/* 곱셈표 (2단~maxN단, 제곱수 대각선 강조) */
function timesTable(maxN) {
  const cell = maxN > 9 ? "14mm" : "20mm";
  const fs = maxN > 9 ? "12pt" : "16pt";
  let h = `<tr><td class="tt-h tt-corner">×</td>`;
  for (let c = 2; c <= maxN; c++) h += `<td class="tt-h">${c}</td>`;
  h += `</tr>`;
  for (let r = 2; r <= maxN; r++) {
    h += `<tr class="${r % 2 ? "tt-alt" : ""}"><td class="tt-h">${r}</td>`;
    for (let c = 2; c <= maxN; c++) h += `<td class="${r === c ? "tt-sq" : ""}">${r * c}</td>`;
    h += `</tr>`;
  }
  return `<div class="tt-wrap"><div class="tt-title">🌱 ${maxN}단 곱셈표</div><table class="ttable" style="--ttc:${cell};--ttf:${fs}">${h}</table><div class="tt-note">노란 칸은 같은 수를 두 번 곱한 수(제곱수)예요. 규칙을 찾아보세요!</div></div>`;
}

/* 넓이 모델 미니 다이어그램 (c칸 r줄) */
function rectDiag(c, r, bg) {
  let cells = "";
  for (let i = 0; i < c * r; i++) cells += `<span style="width:2.8mm;height:2.8mm;border:0.3mm solid #888;background:${bg || "#fff"}"></span>`;
  return `<span style="display:inline-grid;grid-template-columns:repeat(${c},2.8mm);gap:0.3mm;vertical-align:middle;margin:0 1mm">${cells}</span>`;
}

/* ══════════ 화면 구성 ══════════ */
let state = { si: 0, seed: 260808, show: false, blank: false };

/* 페이지별 문제 생성 — 페이지 내 중복 금지, 앞·뒷면 교차 중복 금지(sharedSeen; pageUnique 시트는 면별), 시트 id 해시로 시트마다 다른 수열 */
function genUnique(sheet, seed, page, sharedSeen, countOverride) {
  const count = countOverride !== undefined ? countOverride : sheet.counts[page];
  const out = []; const seen = (sheet.pageUnique || !sharedSeen) ? new Set() : sharedSeen; let salt = 0;
  let sh = 0; for (let i = 0; i < sheet.id.length; i++) sh = (sh * 31 + sheet.id.charCodeAt(i)) | 0;
  while (out.length < count && salt < count * 60) {
    const rng = mulberry32(seed * 7919 + page * 524287 + out.length * 104729 + salt * 31 + sh);
    const p = sheet.gen(rng, page, out.length);
    const key = sheet.keyOf ? sheet.keyOf(p) : JSON.stringify(p);
    if (!seen.has(key)) { seen.add(key); out.push(p); }
    salt++;
  }
  return sheet.sortItems ? sheet.sortItems(out, page) : out;
}

function headerHTML(sheet, code, pg) {
  const flag = `${state.blank ? ' <span class="red" style="white-space:nowrap">— 빈 연습지</span>' : ""}${state.show && !state.blank ? ' <span class="red" style="white-space:nowrap">(정답지)</span>' : ""}`;
  if (pg === 0) {
    return `<div class="sheet-head">
      <div class="title-bubble"><span>${sheet.title}${flag}</span></div>
      <div class="head-side">
        <div class="thumb">👍 ${sheet.book}</div>
        <div class="brand">📖 blog.naver.com/shuleb · No.${code}</div>
        <div class="date"><span class="datebox"></span> 월<span class="gap"></span><span class="datebox"></span> 일</div>
      </div></div>`;
  }
  return `<div class="sheet-head small">
    <div class="mini-title">${sheet.title}${flag} — 뒷면(2쪽)</div>
    <div class="head-side"><div class="brand">📖 blog.naver.com/shuleb · No.${code}</div></div></div>`;
}

function footerHTML(sheet, pg) {
  if (sheet.cat === "md") return pg === 1 ? `<div class="quest">😎 &lt;마무리 퀘스트&gt; 짝짝짝! 잘했습니다. 오늘 공부한 내용을 정리해서 써 보세요.</div>` : "";
  if (pg === 1) return `<div class="sheet-foot"><div class="mood">지금 나의 기분을 색칠해 보세요! <span>🙁 😌 😊 😍 🤩</span></div></div>`;
  return "";
}

function exampleHTML(sheet) {
  if (state.blank) return "";
  if (sheet.example) return sheet.example;
  if (sheet.exampleProb) {
    return `<div class="example"><span class="tag">보기</span><div class="example-grids">${sheet.render(sheet.exampleProb, true, -1, false)}</div></div>`;
  }
  return "";
}

function renderAll() {
  const sheet = SHEETS[state.si];
  const code = encodeCode(state.si, state.seed);
  document.getElementById("sheetCode").textContent = code;
  document.getElementById("blankWrap").style.display = sheet.layout === "grid" ? "flex" : "none";
  if (sheet.layout !== "grid") state.blank = false;
  document.getElementById("chkBlank").checked = state.blank;
  let html = "";
  const sharedSeen = new Set();
  for (let pg = 0; pg < 2; pg++) {
    const cnt = (state.blank && sheet.blankCounts) ? sheet.blankCounts[pg] : sheet.counts[pg];
    const probs = genUnique(sheet, state.seed, pg, sharedSeen, cnt);
    const inner = probs.map(p => sheet.render(p, state.show && !state.blank, pg, state.blank)).join("");
    const body = sheet.layout === "grid"
      ? `<div class="grid-area ${sheet.gridClass || ""}" style="--cols:${sheet.cols || 3}">${inner}</div>`
      : `<div class="rows ${sheet.rowClass || ""}">${inner}</div>`;
    const intro = pg === 0
      ? `${sheet.readAloud ? `<div class="read-aloud"><span class="label">&lt;${sheet.readAloud}&gt;</span></div>` : ""}
         <div class="principle">${sheet.principle}</div>
         ${sheet.encourage ? `<div class="encourage">${sheet.encourage}</div>` : ""}
         ${exampleHTML(sheet)}`
      : (sheet.page2Example && !state.blank ? sheet.page2Example : "");
    const fCls = sheet.book === "덧셈뺄셈 1단계" ? "f-xl" : (sheet.book === "덧셈뺄셈 2단계" ? "f-lg" : "");
    html += `<div class="sheet ${fCls}">${headerHTML(sheet, code, pg)}${intro}${body}${footerHTML(sheet, pg)}</div>`;
  }
  document.getElementById("pages").innerHTML = html;
}

function initControls() {
  const sel = document.getElementById("skillSelect");
  let curBook = null, og = null;
  SHEETS.forEach((s, i) => {
    if (s.book !== curBook) {
      curBook = s.book;
      og = document.createElement("optgroup");
      og.label = curBook;
      sel.appendChild(og);
    }
    const opt = document.createElement("option");
    opt.value = i; opt.textContent = s.title;
    og.appendChild(opt);
  });
  sel.value = state.si;
  sel.addEventListener("change", () => { state.si = Number(sel.value); renderAll(); });
  document.getElementById("btnPrev").addEventListener("click", () => {
    state.si = (state.si - 1 + SHEETS.length) % SHEETS.length; sel.value = state.si; renderAll();
  });
  document.getElementById("btnNext").addEventListener("click", () => {
    state.si = (state.si + 1) % SHEETS.length; sel.value = state.si; renderAll();
  });
  document.getElementById("btnRegen").addEventListener("click", () => {
    state.seed = Math.floor(Math.random() * 999983) + 1; renderAll();
  });
  const btnAns = document.getElementById("btnAnswer");
  btnAns.addEventListener("click", () => {
    state.show = !state.show;
    btnAns.classList.toggle("toggled", state.show);
    btnAns.textContent = state.show ? "문제지 보기" : "정답지 보기";
    renderAll();
  });
  document.getElementById("chkBlank").addEventListener("change", e => {
    state.blank = e.target.checked; renderAll();
  });
  document.getElementById("btnPrint").addEventListener("click", () => { window.print(); });
  document.getElementById("codeChip").addEventListener("click", () => {
    const v = prompt("문제지 번호를 입력하면 같은 문제지를 다시 만들어 드려요.\n(정답지 보기를 누르면 그 문제지의 정답지가 됩니다.)");
    if (!v) return;
    const num = parseInt(v.trim(), 36);
    const si = Math.floor(num / 1000000), seed = num % 1000000;
    if (isNaN(num) || num < 0 || si >= SHEETS.length) { alert("번호를 다시 확인해 주세요."); return; }
    state.si = si; state.seed = seed;
    sel.value = si;
    renderAll();
  });
}

if (typeof document !== "undefined" && document.getElementById("pages")) {
  initControls();
  renderAll();
}
if (typeof globalThis !== "undefined") { globalThis.__SHEETS = SHEETS; globalThis.__genUnique = typeof genUnique !== "undefined" ? genUnique : null; }
</script>
</body>
</html>
